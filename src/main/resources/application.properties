# Configuracoes do Banco PostgreSQL (pega das variaveis de ambiente ou usa o Docker local na porta 5434)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/fisico_quimica}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:adminpassword}

# O Hibernate atualiza as tabelas sozinho baseado nas classes @Entity (muito pratico!)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Porta do servidor web (se estiver na nuvem ele pega a variavel PORT, senao roda na 8080)
server.port=${PORT:8080}
