# Perfil H2: criei esse perfil pra conseguir rodar o backend sem precisar abrir o Docker toda vez!
# Ele salva os dados num arquivinho local na pasta ./data e imita o modo PostgreSQL
spring.datasource.url=jdbc:h2:file:./data/fisico_quimica_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Por seguranca, deixei o console do H2 desativado por padrao (false) pra ninguem de fora mexer no banco!
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
server.port=${PORT:8080}
