# Configuracao de build caso a pasta frontend seja escolhida direto na Netlify
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirecionamento pro React Router nao quebrar quando recarregar a pagina (F5)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguranca pra evitar clickjacking (iframe falso) e sniffing de MIME type
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
